# Server Port
server.port=8080

# Spring Application Name
spring.application.name=dosje-monitoring-backend

# Default MySQL DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/dosje_monitoring?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Multipart / File Upload limit for evidence photos & videos
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT Security Configuration
app.jwt.secret=9a6747f3a1824d55b0a793a388b1480f2d1e2e9b08e5c14f7b6d92a08412e605
app.jwt.expiration-ms=86400000

# CORS Allowed Origins
app.cors.allowed-origins=*
