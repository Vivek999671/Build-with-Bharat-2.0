# Server Port
server.port=8080

# Spring Application Name
spring.application.name=dosje-monitoring-backend

# Supabase PostgreSQL DataSource Configuration
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SUPABASE_DB_USERNAME:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Multipart / File Upload limit for evidence photos & videos
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Supabase Storage Integration
supabase.url=${SUPABASE_URL:}
supabase.key=${SUPABASE_KEY:${SUPABASE_SERVICE_ROLE_KEY:}}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:evidence}

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:9a6747f3a1824d55b0a793a388b1480f2d1e2e9b08e5c14f7b6d92a08412e605}
app.jwt.expiration-ms=86400000

# CORS Allowed Origins
app.cors.allowed-origins=*
